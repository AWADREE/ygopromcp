name: Windows package checks

on:
  push:
    paths:
      - 'tools/release/**'
      - '.github/workflows/windows-package-check.yml'
  pull_request:
    paths:
      - 'tools/release/**'
      - '.github/workflows/windows-package-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed dependency map and game-data launcher
        shell: pwsh
        run: ./tools/release/Test-WindowsPackage.ps1 -TestRoot "$env:RUNNER_TEMP\ygopromcp-package-preflight"

# This check does not build or publish an executable. A release candidate must
# additionally pass an actual GNU/UCRT64 build, dependency-closure package,
# isolated startup/MCP tests, and a separate rights/source-offer review.
